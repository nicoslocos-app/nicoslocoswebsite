<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nicoslocos Early Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--blue:#0066ff;--gold:#c6ab70}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#060709;color:#f5f5f7;font-family:Manrope,Arial,sans-serif;display:grid;place-items:center;padding:28px}
    main{width:min(100%,760px);text-align:center}
    .brand{font-size:26px;font-weight:650;letter-spacing:-1px;margin-bottom:8px}
    .brand span{color:var(--blue)}
    .tag{font-size:9px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:38px}
    h1{font-size:clamp(36px,7vw,62px);line-height:1.05;letter-spacing:-2.5px;font-weight:500;margin:0 0 18px}
    p{max-width:520px;margin:0 auto 28px;color:#9ba3b2;font-size:14px;line-height:1.8}
    .form-card{padding:24px;background:linear-gradient(145deg,#101722,#0b0e14);border:1px solid #2b3547;border-radius:9px;box-shadow:0 30px 80px #0008}
    .label{font-size:9px;letter-spacing:1.8px;color:var(--gold);text-transform:uppercase;margin-bottom:18px}
    iframe{display:block;width:100%;max-width:100%;height:600px;border:0;border-radius:5px;background:white}
    .hint{font-size:11px;color:#7f899b;margin-top:18px}
    @media(max-width:620px){body{padding:18px}.form-card{padding:16px}iframe{height:640px}}
  </style>
</head>
<body>
  <main>
    <div class="brand">nicoslocos<span>.</span></div>
    <div class="tag">Menu engineering &amp; profit system</div>
    <h1>Early access.</h1>
    <p>This is a simple test page. If you can see this page but not the form below, the Brevo embed is blocked or the form settings need checking.</p>
    <section class="form-card" aria-label="Early access form">
      <div class="label">Brevo form test</div>
      <iframe width="540" height="305" src="https://2b1d4d7a.sibforms.com/v2/serve/MUIFAO2_fDvUCrsczt1G50m2jCd0zWaJ4pMfyr80mdPsyzVMha6ID3revWxuELPdt-V3gne1Y6wR1q3kA3wxMyeayOcMpj5oq3h2U_R4wL28oEAFkhBzGXVn6h3rxCscqXQbQ-FDw5yGB8eNQEDyLZesHBN7_pd3iDiNPdHKmiqcoBvqBX8Gtgg0L1MiQZSTx74N0UgsYvob2YdhCw==" frameborder="0" scrolling="auto" allowfullscreen></iframe>
      <div class="hint">If this form appears here, the embed itself works.</div>
    </section>
  </main>
</body>
</html>
